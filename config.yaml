# All settings live here. A value like $NAME is read from the environment
# variable NAME (or from .env). Use $$ for a literal value starting with "$".

app:
  name: "FastAPI Backend"

database:
  type: "postgresql"   # sqlite | postgresql
  host: "localhost"
  port: 5432
  database: "postgres"
  user: $POSTGRES_USER
  password: $POSTGRES_PASSWORD
  sqlite_path: "./data.db"   # only used when type is sqlite

auth:
  secret_key: $SECRET_KEY
  access_token_expire_minutes: 3200
  algorithm: "HS256"

google:
  enabled: true
  client_id: $GOOGLE_CLIENT_ID
  client_secret: $GOOGLE_CLIENT_SECRET
  redirect_uri: $GOOGLE_REDIRECT_URI
  frontend_url: $FRONTEND_URL

cors:
  allowed_origins: $ALLOWED_ORIGINS   # comma-separated list or "*"

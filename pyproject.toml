[project]
name = "fastapi_backend"
version = "0.1.0"
description = "Basic FastAPI Backend"
readme = "README.md"
requires-python = "==3.13.2"
dependencies = [
    "fastapi[standard]==0.162.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.6",
    "bcrypt>=5.0.0",
    "alembic>=1.20.1",
    "pyyaml>=6.0.3",
    "google-auth[requests]>=2.62.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
sqlite = [
    "aiosqlite>=0.22.1",
]
postgres = [
    "asyncpg>=0.32.0",
]
# Instala todo para desarrollo
dev = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
]
